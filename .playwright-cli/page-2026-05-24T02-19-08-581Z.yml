                - paragraph [ref=e554]: 4️⃣ 感受声音从耳朵流进身体
                - paragraph [ref=e555]
                - paragraph [ref=e556]: 不用冥想经验，不用特殊姿势。
                - paragraph [ref=e557]
                - paragraph [ref=e558]: 只需要听。
                - paragraph [ref=e559]
                - paragraph [ref=e560]: 我是润泽，颂钵疗愈师，也是五感六觉品牌创始人。
